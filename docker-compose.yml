# Demo F&B Nodes bằng Docker — tương đương stack Laragon (Apache + PHP 8.3 + MySQL 8.4).
# MySQL đổi sang port HOST 3206 để tránh trùng cổng 3306 trên máy bạn.
# Source được COPY vào image app (không bind-mount) → chạy được cả khi Docker Desktop
# chưa chia sẻ đường dẫn repo (vd /media/lenovo/D/...). Sửa code xong chạy lại sh docker-demo.sh.
# Chế độ sửa-code-thấy-ngay (cần Docker Desktop Settings -> Resources -> File Sharing):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Chạy nhanh: sh docker-demo.sh   (build, chờ MySQL, chạy migration + seed, in URL)

name: fbn-demo

services:
  db:
    image: mysql:8.4
    container_name: fbn-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00
    environment:
      # Demo cục bộ; đổi bằng biến môi trường MYSQL_ROOT_PASSWORD nếu muốn.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fbn_demo_root}
      MYSQL_DATABASE: restaurant_chain_scope_v2
      TZ: Asia/Ho_Chi_Minh
    ports:
      # host 3206 -> MySQL 3306 trong container (KHÔNG trùng 3306 của máy bạn)
      - "3206:3306"
    volumes:
      - fbn_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    container_name: fbn-web
    restart: unless-stopped
    ports:
      # Web demo ở http://localhost:8080/restaurant-chain/ (đổi qua APP_PORT nếu trùng)
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fbn_mysql_data:
